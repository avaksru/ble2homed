{
	"log": {
		"level": "debug",
		"file_path": "./logs/ble2homed.log",
		"max_size": 10,
		"max_backups": 3,
		"max_age": 28,
		"compress": true
	},
	"retain": false,
	"history": {
		"enabled": false
	},
	"ble": {
		"scan_interval": 0,
		"restart_pause": 0
	},
	"web": {
		"enabled": false,
		"port": 8081
	},
	"presence_timeout": 60,
	"mqtt_host": "tcp://localhost:1883",
	"mqtt_prefix": "homed",
	"mqtt_format_json": true
}